apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: accesschat
data:
  accesschat.json: |
    {
      "id": null,
      "uid": "accesschat-main",
      "title": "AccessChat — API & Infrastructure",
      "tags": ["accesschat"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "API — Backend NestJS",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 2,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 1, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          },
          "options": { "legend": { "displayMode": "list" } },
          "targets": [
            {
              "expr": "sum(rate(accesschat_http_request_duration_seconds_count[2m])) by (route)",
              "legendFormat": "{{ route }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Response Time P50 / P95 / P99",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 1, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(accesschat_http_request_duration_seconds_bucket[2m])) by (le))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(accesschat_http_request_duration_seconds_bucket[2m])) by (le))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(accesschat_http_request_duration_seconds_bucket[2m])) by (le))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 1, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "fixedColor": "red", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(accesschat_http_request_duration_seconds_count{status_code=~\"4..|5..\"}[2m]))",
              "legendFormat": "Errors/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Status Codes",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 9, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(accesschat_http_request_duration_seconds_count[2m])) by (status_code)",
              "legendFormat": "HTTP {{ status_code }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node.js Event Loop Lag",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 9, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "accesschat_nodejs_eventloop_lag_seconds",
              "legendFormat": "Event Loop Lag",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Heap Used vs Total",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "accesschat_nodejs_heap_size_used_bytes",
              "legendFormat": "Heap Used",
              "refId": "A"
            },
            {
              "expr": "accesschat_nodejs_heap_size_total_bytes",
              "legendFormat": "Heap Total",
              "refId": "B"
            }
          ]
        },
        {
          "id": 8,
          "title": "Active HTTP Connections",
          "type": "stat",
          "gridPos": { "x": 12, "y": 16, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "accesschat_nodejs_active_handles_total",
              "legendFormat": "Active Handles",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Process CPU Usage",
          "type": "stat",
          "gridPos": { "x": 18, "y": 16, "w": 6, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            {
              "expr": "rate(accesschat_process_cpu_seconds_total[1m])",
              "legendFormat": "CPU",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Traefik Ingress",
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 11,
          "title": "Traefik — Requests/s by Service",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total[2m])) by (service)",
              "legendFormat": "{{ service }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "title": "Traefik — Response Duration P95",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket[2m])) by (le, service))",
              "legendFormat": "P95 {{ service }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "type": "row",
          "title": "Oracle Cloud Host — Node Exporter",
          "gridPos": { "x": 0, "y": 32, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 14,
          "title": "CPU Usage %",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 33, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m]))",
              "legendFormat": "CPU Used",
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 33, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
              "legendFormat": "Used",
              "refId": "A"
            },
            {
              "expr": "node_memory_MemTotal_bytes",
              "legendFormat": "Total",
              "refId": "B"
            }
          ]
        },
        {
          "id": 16,
          "title": "Network I/O",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 33, "w": 8, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*\"}[2m])",
              "legendFormat": "RX {{ device }}",
              "refId": "A"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*\"}[2m])",
              "legendFormat": "TX {{ device }}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 17,
          "title": "Disk I/O",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 40, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total[2m])",
              "legendFormat": "Read {{ device }}",
              "refId": "A"
            },
            {
              "expr": "rate(node_disk_written_bytes_total[2m])",
              "legendFormat": "Write {{ device }}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 18,
          "title": "Disk Space Used",
          "type": "gauge",
          "gridPos": { "x": 12, "y": 40, "w": 12, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.7 },
                  { "color": "red", "value": 0.9 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
              "legendFormat": "/ (root)",
              "refId": "A"
            }
          ]
        }
      ]
    }
