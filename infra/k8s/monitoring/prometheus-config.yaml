apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: accesschat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'accesschat-backend'
        static_configs:
          - targets: ['accesschat-backend:4001']
        metrics_path: /metrics
        scheme: http

      - job_name: 'accesschat-frontend'
        static_configs:
          - targets: ['accesschat-frontend:3003']
        metrics_path: /metrics
        scheme: http

      - job_name: 'traefik'
        static_configs:
          - targets: ['traefik-metrics.kube-system.svc.cluster.local:9100']
        metrics_path: /metrics
        scheme: http

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter:9100']
