# Ingress — namespace: tokusatsu
# Jenkins:    https://jenkins.157-151-29-59.sslip.io
# Grafana:    https://grafana.157-151-29-59.sslip.io
# SonarQube:  https://sonar.157-151-29-59.sslip.io
# MinIO:      https://minio.157-151-29-59.sslip.io
# Prometheus: https://prometheus.157-151-29-59.sslip.io
# VoD API:    https://vod.157-151-29-59.sslip.io
# Frontend:   https://tokusatsu.157-151-29-59.sslip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: tokusatsu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jenkins.157-151-29-59.sslip.io
      secretName: jenkins-tls
  rules:
    - host: jenkins.157-151-29-59.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8081
