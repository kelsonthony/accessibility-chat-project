apiVersion: apps/v1
kind: Deployment
metadata:
  name: accesschat-frontend
  namespace: accesschat
  labels:
    app: accesschat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accesschat-frontend
  template:
    metadata:
      labels:
        app: accesschat-frontend
    spec:
      containers:
        - name: frontend
          image: local/accesschat-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: accesschat-frontend
  namespace: accesschat
spec:
  type: LoadBalancer
  selector:
    app: accesschat-frontend
  ports:
    - name: http
      port: 3003
      targetPort: 3000
