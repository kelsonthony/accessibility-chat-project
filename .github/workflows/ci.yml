name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npm run lint --workspace @handtalk-challenge/backend

      - name: Type-check frontend
        run: npm run lint --workspace @handtalk-challenge/frontend

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test --workspace @handtalk-challenge/backend

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:3003' }}
      E2E_TEST_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build frontend
        run: npm run build --workspace @handtalk-challenge/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || 'http://localhost:3001' }}

      - name: Start frontend (background)
        run: npm run start --workspace @handtalk-challenge/frontend &
        env:
          PORT: 3003

      - name: Wait for frontend to be ready
        run: npx --yes wait-on http://localhost:3003 --timeout 60000

      - name: Run E2E tests
        run: npm run test --workspace @handtalk-challenge/e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
