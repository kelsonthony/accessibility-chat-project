apiVersion: apps/v1
kind: Deployment
metadata:
  name: accesschat-backend
  namespace: accesschat
  labels:
    app: accesschat-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accesschat-backend
  template:
    metadata:
      labels:
        app: accesschat-backend
    spec:
      containers:
        - name: backend
          image: local/accesschat-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: BACKEND_PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: accesschat-backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: accesschat-backend
  namespace: accesschat
spec:
  type: LoadBalancer
  selector:
    app: accesschat-backend
  ports:
    - name: http
      port: 4001
      targetPort: 3001
